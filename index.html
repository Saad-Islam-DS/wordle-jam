<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wordle-jam</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>wordle-jam</h1>
  </header>

  <main>
    <div id="board"></div>
    <div id="keyboard"></div>
    <div id="message" aria-live="polite"></div>
  </main>

  <script src="src/game.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/input.js"></script>
  <script>
    // Boot
    window.addEventListener('DOMContentLoaded', async () => {
      await Game.init();
      UI.mount(document.getElementById('board'), document.getElementById('keyboard'));
      Input.bind();
    });
  </script>
</body>
</html>
